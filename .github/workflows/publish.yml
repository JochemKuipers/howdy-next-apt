name: Build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream howdy-next tag (empty = latest Codeberg release)
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]

concurrency:
  group: package
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache vendored deps and ccache
        uses: actions/cache@v6
        with:
          path: |
            deps-prefix
            .ccache
          key: deps-trixie-${{ hashFiles('deps.versions', 'scripts/build-opencv5.sh', 'scripts/build-yyjson.sh', 'scripts/build-inih.sh') }}
          restore-keys: |
            deps-trixie-

      - name: Build Debian package
        env:
          UPSTREAM_TAG: ${{ github.event.inputs.tag }}
        run: |
          mkdir -p deps-prefix .ccache out src
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e UPSTREAM_TAG \
            -e HOWDY_DEPS_PREFIX=/opt/howdy-next-deps \
            -e CCACHE_DIR=/cache/ccache \
            -e CMAKE_BUILD_PARALLEL_LEVEL=4 \
            -v "$PWD:/work" \
            -v "$PWD/deps-prefix:/opt/howdy-next-deps" \
            -v "$PWD/.ccache:/cache/ccache" \
            -w /work \
            debian:trixie \
            bash /work/scripts/ci-build.sh
          sudo chown -R "$(id -u):$(id -g)" out deps-prefix .ccache src || true

      - name: Record version
        id: meta
        run: |
          echo "tag=$(cat out/upstream-tag.txt)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat out/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload debs
        uses: actions/upload-artifact@v7
        with:
          name: debs
          path: |
            out/*.deb
            out/*.changes
            out/*.buildinfo
            out/upstream-tag.txt
            out/version.txt
          if-no-files-found: error

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: howdy-next ${{ steps.meta.outputs.version }}
          body: |
            Unofficial Debian package of [howdy-next ${{ steps.meta.outputs.tag }}](https://codeberg.org/nathawat/howdy-next).

            Install from the combined APT repo: https://jochemkuipers.github.io/apt-repo
          files: |
            out/howdy-next_*.deb
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Summary
        run: |
          {
            echo "## Howdy Next ${{ steps.meta.outputs.tag }}"
            echo
            echo "Install from \`https://jochemkuipers.github.io/apt-repo\`"
            echo
            echo '```sh'
            echo 'curl -fsSL https://jochemkuipers.github.io/apt-repo/jochem.sources | sudo tee /etc/apt/sources.list.d/jochem.sources'
            echo 'sudo apt update'
            echo 'sudo apt install howdy-next'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
