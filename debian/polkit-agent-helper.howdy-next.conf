# Relax the polkit 127 helper device sandbox so pam_howdy.so can open
# the camera and, when the native prompt is unavailable, /dev/uinput.
# StandardError must not inherit the protocol socket: OpenCV warnings on
# stderr are treated as helper protocol and KDE cancels the dialog.
# See https://codeberg.org/nathawat/howdy-next/wiki/Polkit-127-compatibility
[Service]
PrivateDevices=no
DeviceAllow=char-video4linux rw
DeviceAllow=/dev/uinput rw
StandardError=journal
